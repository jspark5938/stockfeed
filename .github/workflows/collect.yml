name: 발언 수집
on:
  schedule:
    - cron: "17,47 * * * *"   # 30분마다
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collector/collect.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_V3 }}
      - name: 결과 저장
        run: |
          git config user.name "stockfeed-bot"
          git config user.email "stockfeed-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: 수집 결과 갱신"
          git push
