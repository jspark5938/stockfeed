name: 안드로이드 테스트 앱 빌드
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "index.html", "android/**", "capacitor.config.json", "package.json", "build.js", ".github/workflows/build-apk.yml"]
permissions:
  contents: write
concurrency: build-apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: APK 만들기
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: 다운로드용으로 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk stockfeed-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build stockfeed-test.apk --prerelease --title "테스트 빌드" --notes "시험용 앱입니다. 스토어 출시용이 아닙니다."
